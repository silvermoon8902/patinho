upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ── HTTP (port 80) ───────────────────────────────────────────────────
# Keeps the ACME challenge reachable for cert renewal; everything else
# is redirected to HTTPS on the canonical host. Anyone arriving on the
# raw IP is bounced to the proper domain (the cert only covers the
# duckdns hostname).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://patinho-test.duckdns.org$request_uri;
    }
}

# ── HTTPS (port 443) ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name patinho-test.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/patinho-test.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patinho-test.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. HSTS is intentionally NOT set yet — once browsers
    # cache it you cannot roll back to HTTP, so it stays off until HTTPS
    # has been stable in production for a while.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https://api.mercadopago.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    include /etc/nginx/conf.d/locations.inc;
}
