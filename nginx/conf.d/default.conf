upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ── HTTP (port 80) ───────────────────────────────────────────────────
# Serves the ACME challenge for Let's Encrypt cert issuance/renewal and
# otherwise proxies the app. Once HTTPS is confirmed working this block
# will switch to a 301 redirect (see the commented section at the end).
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https://api.mercadopago.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Let's Encrypt HTTP-01 challenge — must stay reachable over plain
    # HTTP even after the HTTPS redirect is enabled, for cert renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/locations.inc;
}

