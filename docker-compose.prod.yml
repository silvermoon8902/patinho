# Shared log rotation policy — applied per-service below via YAML anchors.
x-prod-logging: &prod-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    restart: always
    logging: *prod-logging

  redis:
    restart: always
    logging: *prod-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *prod-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery_worker:
    restart: always
    logging: *prod-logging

  celery_beat:
    restart: always
    logging: *prod-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    logging: *prod-logging

  flower:
    image: mher/flower:2.0
    restart: always
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555 --url_prefix=flower
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    expose:
      - "5555"
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
    logging: *prod-logging

  nginx:
    restart: always
    logging: *prod-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_files:/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  # Certbot renewal daemon. Disabled by default — enable once a real domain
  # is pointed at the VPS and the initial cert has been issued. See
  # nginx/conf.d/ssl.conf.example for the activation steps.
  #
  # One-time cert issuance:
  #   docker run --rm \
  #     -v "$(pwd)/certbot/conf:/etc/letsencrypt" \
  #     -v "$(pwd)/certbot/www:/var/www/certbot" \
  #     certbot/certbot certonly --webroot -w /var/www/certbot \
  #     -d patinho.example.com --email admin@patinho.example.com \
  #     --agree-tos --no-eff-email
  #
  # certbot:
  #   image: certbot/certbot:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: >
  #     /bin/sh -c 'trap exit TERM;
  #     while :; do certbot renew --webroot -w /var/www/certbot --quiet;
  #     sleep 12h & wait $${!}; done;'
